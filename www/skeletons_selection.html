<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mark Bones - OsteoMap</title>
    <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

    <div class="app">

        <!-- ====== PAGE HEADER ====== -->
        <header class="page-header">

            <button
                id="back-to-overview-button"
                class="back-button"
                type="button"
                aria-label="Back to Overview"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <div>
                <h1 style="margin:0;font-size:clamp(18px,5vw,24px);">
                    <span id="accession-display">---</span>
                </h1>
                <div style="color: var(--primary); font-weight: 700; font-size: 14px;">
                    Site: <span id="site-display">---</span>
                </div>
            </div>

        </header>

        <!-- ====== MAIN CONTENT ====== -->
        <main class="main-content">

            <!-- ====== SEGMENT TABS ====== -->
            <div class="segment-tabs" id="segment-tabs">
                <!-- Tabs generated by JavaScript -->
            </div>

            <!-- ====== SELECTED SEGMENT ROW + ALL PRESENT BUTTON ====== -->
            <div class="selected-row">
                <div id="selected-segment-name">Select a segment above</div>

                <button
                    id="all-present-button"
                    class="segment-tab"
                    type="button"
                    disabled
                >
                    All Present
                </button>
            </div>

            <!-- ====== LEGEND ====== -->
            <div id="legend">
                <span class="item"><span class="dot green"></span> Present</span>
                <span class="item"><span class="dot orange"></span> Fragmented</span>
                <span class="item"><span class="dot grey"></span> Absent</span>
                <span class="item"><span class="dot white"></span> Unmarked</span>
            </div>

            <!-- ====== SKELETON CONTAINER ====== -->
            <div id="skeleton-select-container">
                <div style="text-align:center;color:var(--text-muted);padding:40px;">
                    Select a segment to begin
                </div>
            </div>

            <!-- ====== SELECTED INFO ====== -->
            <div id="selected-info">
                <span class="label">Selected:</span>
                <span class="value" id="selected-zone-label">None</span>
            </div>

            <!-- ====== DETAILS BOX (popup) ====== -->
            <div id="details-box">

                <!-- Close button (top-right) -->
                <button
                    id="details-close"
                    class="details-close"
                    type="button"
                    aria-label="Close"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M15 18l-6-6 6-6"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </button>

                <div class="bone-name" id="detail-bone-name">Bone Name</div>
                <div class="bone-status" id="detail-bone-status">
                    <span class="status-dot" id="detail-status-dot" style="background:#ffffff;"></span>
                    <span id="detail-status-text">Unmarked</span>
                </div>
                <div class="state-buttons">
                    <button class="state-btn present" data-state="present-complete">
                        <span class="dot green"></span> Present
                    </button>
                    <button class="state-btn fragmented" data-state="present-fragmented">
                        <span class="dot orange"></span> Fragmented
                    </button>
                    <button class="state-btn absent" data-state="absent">
                        <span class="dot grey"></span> Absent
                    </button>
                </div>
            </div>

        </main>

    </div>

    <script type="module" src="js/skeletons_selection.js?v=6"></script>

</body>
</html>
