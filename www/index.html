<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>OsteoMap</title>

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body>

    <div class="app">

        <header class="app-header">
            <h1>OsteoMap</h1>
        </header>

        <main class="main-content">

            <section class="sites-section">

                <div class="section-heading">
                    <h2>Available Sites</h2>
                </div>

                <div id="site-list" class="site-list"></div>

            </section>

        </main>

        <footer class="bottom-actions">

            <a
                href="addSite.html"
                class="button button-primary"
            >
                <span class="button-icon">＋</span>
                Add a new site
            </a>

            <button
                id="delete-site-button"
                class="button button-danger"
                type="button"
            >
                <svg
                    class="button-svg"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                Delete an existing site
            </button>

        </footer>

    </div>

    <div
        id="delete-site-modal"
        class="modal-overlay"
    >
        <div
            class="modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="delete-site-title"
        >
            <h2 id="delete-site-title">
                Delete Site?
            </h2>

            <p id="delete-site-message">
                Are you sure you want to delete this site?
            </p>

            <div class="modal-actions">

                <button
                    id="cancel-delete-button"
                    class="modal-button modal-button-cancel"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="confirm-delete-button"
                    class="modal-button modal-button-delete"
                    type="button"
                >
                    Delete
                </button>

            </div>
        </div>
    </div>

    <script type="module" src="js/home.js"></script>

</body>
</html>
