<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Site - OsteoMap</title>

    <link rel="stylesheet" href="css/style.css?v=9">
    <link rel="stylesheet" href="css/siteStats.css?v=1">
</head>

<body>

    <div class="app">

        <header class="page-header">

            <a
                id="back-to-sites-button"
                href="index.html"
                class="back-button"
                aria-label="Back to Available Sites"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M15 18l-6-6 6-6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </a>

            <div class="site-header-details">

                <h1 id="site-code-heading">
                    SITE-12345
                </h1>

                <div
                    id="site-description-display"
                    class="site-description-display"
                >
                    <p
                        id="site-location-heading"
                        class="site-header-location"
                    >
                        LOCATION
                    </p>

                    <button
                        id="edit-site-description-button"
                        class="site-description-edit-button"
                        type="button"
                    >
                        Edit
                    </button>
                </div>

                <div
                    id="site-description-editor"
                    class="site-description-editor"
                    hidden
                >
                    <textarea
                        id="site-description-input"
                        aria-label="Site Description"
                        placeholder="Enter site description"
                    ></textarea>

                    <div class="site-description-actions">
                        <button
                            id="cancel-site-description-button"
                            class="site-description-action site-description-cancel"
                            type="button"
                        >
                            Cancel
                        </button>

                        <button
                            id="save-site-description-button"
                            class="site-description-action site-description-save"
                            type="button"
                        >
                            Save
                        </button>
                    </div>
                </div>

            </div>

        </header>


        <main class="main-content">

            <section class="individuals-section">

                <div class="section-heading">

                    <h2>
                        Individuals
                    </h2>

                    <div class="age-filter">

                        <button
                            id="age-filter-button"
                            class="age-filter-button"
                            type="button"
                            aria-haspopup="true"
                            aria-expanded="false"
                        >
                            Age
                            <span aria-hidden="true">▾</span>
                        </button>

                        <div
                            id="age-filter-menu"
                            class="age-filter-menu"
                            role="menu"
                        >
                            <button type="button" role="menuitem" data-age="infant">
                                Infant
                            </button>

                            <button type="button" role="menuitem" data-age="child">
                                Child
                            </button>

                            <button type="button" role="menuitem" data-age="adolescent">
                                Adolescent
                            </button>

                            <button type="button" role="menuitem" data-age="adult">
                                Adult
                            </button>
                        </div>

                    </div>

                </div>


                <div
                    id="individual-list"
                    class="individual-list"
                ></div>

            </section>

            <section
                id="site-stats"
                class="site-stats"
                aria-live="polite"
            ></section>

        </main>


        <footer class="bottom-actions">

            <button
                id="add-individual-button"
                class="button button-primary"
                type="button"
            >
                <span class="button-icon">
                    ＋
                </span>

                Add an Individual
            </button>

            <button
                id="delete-individual-button"
                class="button button-danger"
                type="button"
            >
                <svg
                    class="button-svg"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                Delete an Individual
            </button>

        </footer>

    </div>


    <div
        id="delete-individual-modal"
        class="modal-overlay"
    >

        <div
            class="modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="delete-individual-title"
        >

            <h2 id="delete-individual-title">
                Delete Individual?
            </h2>

            <p id="delete-individual-message">
                Are you sure you want to delete this individual?
            </p>

            <div class="modal-actions">

                <button
                    id="cancel-individual-delete-button"
                    class="modal-button modal-button-cancel"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="confirm-individual-delete-button"
                    class="modal-button modal-button-delete"
                    type="button"
                >
                    Delete
                </button>

            </div>

        </div>

    </div>

    <div
        id="edit-context-modal"
        class="modal-overlay"
    >

        <div
            class="modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="edit-context-title"
        >

            <h2 id="edit-context-title">
                Edit Context / Grave
            </h2>

            <div class="form-group">

                <label for="edit-context-input">
                    Context / Grave
                </label>

                <input
                    id="edit-context-input"
                    type="text"
                    placeholder="Enter context or grave"
                    autocomplete="off"
                >

            </div>

            <div class="modal-actions">

                <button
                    id="cancel-context-edit-button"
                    class="modal-button modal-button-cancel"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="save-context-edit-button"
                    class="modal-button modal-button-save"
                    type="button"
                >
                    Save
                </button>

            </div>

        </div>

    </div>

    <script
        type="module"
        src="js/site.js?v=4"
    ></script>

    <script
        type="module"
        src="js/siteStats.js"
    ></script>

</body>

</html>
